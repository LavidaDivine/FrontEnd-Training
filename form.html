<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <!-- 1. Username
    2. Email
    3. Phone Number
    4. Password
    5. Date of birth
    6. Gender
    7. Nationality
    8. Accept terms and conditions -->

    <form action="" method="get">
        <label for="Username">Username:</label>
        <input type="text" id="Username" name="Username">
        <br>
        <br>

        <label for="Email">Email:</label>
        <input type="email" id="Email" name="Email">
        <br>
        <br>

        <label for="Phone Number">Phone N<ins>O</ins>:</label>
        <input type="phone Number" id="Phone Number" name="phone Number">
        <br>
        <br>

        <label for="Password">Password:</label>
        <input type="password" id="password" name="password">
        <br>
        <br>
        
        <label for="Date of birth">Date of Birth:</label>
        <input type="Date" id="Date of Birth" name="DOB">
        <br>
        <br>

        <label for="Favorite Color">Color</label>
        <input type="color" id="Favorite color" >
        <br>
        <br>

        <label for="pic">Profile Picture</label>
        <input type="file" id="pic" >

        <p>Your Gender</p>
        <label for="Male">Male</label>
        <input type="radio" id="Male" name="Gender">

        <label for="Female">Female</label>
        <input type="radio" id="Female" name="Gender">
        <br>
        <br>

        <label for="Country">Country</label>
        <select name="country" id="country">
            <option selected disabled>Select One</option>
            <option value="USA">USA</option>
            <option value="UK">UK</option>
            <option value="CANADA">CANADA</option>
            <option value="NIGERIA">NIGERIA</option>
            <option value="PARIS">PARIS</option>
            <option value="CHINA">CHINA</option>
        </select>
        <br>
        <br>

        <label for="Terms">By clicking you accept the terms and conditions </label>
        <input type="checkbox" id="Terms" value="yes" required>
        <br>
        <br>

        <button type="submit">Sign Up</button>
    </form>
</body>
</html>
